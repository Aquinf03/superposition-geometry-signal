# Default experiment settings. Override per run; always log the seed used.
seed: 0
model: gpt2-small  # start tiny; swap to pythia-70m / pythia-410m later
device: auto       # auto | cpu | cuda | mps

# Track: geometry logged beside loss
logging:
  every_n_steps: 1
  results_dir: results
  run_name: null          # auto timestamp if null
  log_loss: true
  log_geometry: true
  geometry_metrics:
    - interference_mean       # Metric A
    - spectral_participation  # Metric B
    - coactivation_overlap    # Metric C
  bank_positions: all     # all | last — MLP-out neighbor bank
  probe_prompts: null     # null → scripts.geometry.DEFAULT_PROBE_PROMPTS
  plot_loss_and_geometry: true

# Diff: compare selected features / neighborhoods
diff:
  enabled: true
  modes:
    - pre_post_edit
    - step_vs_step
  top_k_neighbors: 16
  save_neighborhood_plot: true
  selected_features: []   # optional [{name, prompt, position}]

eval:
  fingerprint_n_layers: 8
  paraphrase_templates: null
  ripple_probes: null
  fingerprint_probes: null
