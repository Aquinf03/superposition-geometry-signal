# Hero run: fine-tune GPT-2 small while logging live loss | multi-layer geometry
seed: 0
model: gpt2-small
device: auto

train:
  corpus: data/train_corpus.txt
  seq_len: 64
  batch_size: 4
  max_steps: 40
  lr: 5.0e-5
  weight_decay: 0.01
  grad_clip: 1.0

geometry:
  # Early / mid / late MLP-out layers (gpt2-small has 0..11)
  layers: [4, 8, 11]
  every_n_steps: 1          # log geometry on this cadence (same as loss log)
  bank_positions: last      # last-token MLP-out probes (cheap + stable)
  top_k_neighbors: 8
  metrics:
    - interference_mean
    - spectral_participation
    - coactivation_overlap
  # null → scripts.helpers.geometry.DEFAULT_PROBE_PROMPTS
  probe_prompts: null

logging:
  results_dir: results
  run_name: train_gpt2_small_geometry
  live_print: true
  # Weight + matching geometry JSON every N steps (and at final)
  save_every_n_steps: 20

# Soft geometry regularizer (spg.GeoControl). Off by default — watch-only baseline.
# Enable via train_gpt2_small_geometry_control.yaml (or set enabled: true here).
# Modes: point (default) or band (hinge outside [lo, hi]). See control_band yaml.
control:
  enabled: false
  layer: 8
  metric: interference_mean   # differentiable path in spg.grad_geometry (only this for now)
  mode: point                 # point | band
  target: 0.35
  # lo / hi: used when mode: band (also accepted as band_lo / band_hi)
  # lo: 0.30
  # hi: 0.40
  weight: 1.0e-3              # λ in loss = lm_loss + λ · err²
  every_n_steps: 1            # apply penalty on this cadence
  warmup_steps: 5             # watch-only steps before gate + regularizer
  abort_on_warmup_fail: true  # fail closed if geo flat/saturated after warmup
  abort_on_warn: false        # true → raise if flat/saturated while regularizer active

# Diff selected features across two aligned checkpoints (ckpt A vs B)
diff:
  top_k_neighbors: 8
  save_neighborhood_plot: true
  # Defaults: earliest vs latest in checkpoints/manifest.json
  # Override on CLI: --step-a 19 --step-b 39
  selected_features:
    - name: eiffel_located_in
      prompt: "The Eiffel Tower is located in"
      position: last
    - name: louvre_located_in
      prompt: "The Louvre Museum is located in"
      position: last
    - name: superposition_pack
      prompt: "Superposition allows neural networks to represent more features than"
      position: last
  # Cross-feature pairs at one ckpt (related vs unrelated). Omit → all combinations.
  cross_feature_pairs:
    - [eiffel_located_in, louvre_located_in]      # related location cluster
    - [eiffel_located_in, superposition_pack]     # unrelated
    - [louvre_located_in, superposition_pack]     # unrelated
