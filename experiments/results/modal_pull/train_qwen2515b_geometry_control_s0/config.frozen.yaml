seed: 0
model: Qwen/Qwen2.5-1.5B
device: cuda
dtype: bf16
train:
  corpus: data/train_corpus_extended.txt
  seq_len: 64
  batch_size: 1
  max_steps: 200
  lr: 2.0e-05
  weight_decay: 0.01
  grad_clip: 1.0
geometry:
  layers:
  - 7
  - 14
  - 26
  every_n_steps: 10
  bank_positions: last
  top_k_neighbors: 8
  metrics:
  - interference_mean
  - spectral_participation
  - coactivation_overlap
  probe_prompts: null
logging:
  results_dir: /vol/results/qwen_modal
  run_name: train_qwen2515b_geometry_control_s0
  live_print: true
  save_every_n_steps: 50
control:
  enabled: true
  layer: 14
  metric: interference_mean
  mode: point
  target: 0.35
  weight: 0.01
  every_n_steps: 10
  warmup_steps: 20
  abort_on_warmup_fail: true
  abort_on_warn: false
diff:
  top_k_neighbors: 8
  save_neighborhood_plot: true
  selected_features:
  - name: eiffel_located_in
    prompt: The Eiffel Tower is located in
    position: last
  - name: louvre_located_in
    prompt: The Louvre Museum is located in
    position: last
  - name: superposition_pack
    prompt: Superposition allows neural networks to represent more features than
    position: last
  cross_feature_pairs:
  - - eiffel_located_in
    - louvre_located_in
  - - eiffel_located_in
    - superposition_pack
  - - louvre_located_in
    - superposition_pack
