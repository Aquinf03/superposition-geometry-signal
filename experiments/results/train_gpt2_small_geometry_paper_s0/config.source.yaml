# Paper-scale matched runs (longer than the 40-step hero).
# Pair: train_gpt2_small_geometry_paper.yaml (baseline) + this file (control).
#
#   python experiments/run_paper_scale_suite.py --seeds 0 1 2 --steps 500
seed: 0
model: gpt2-small
device: auto

train:
  corpus: data/train_corpus_extended.txt
  seq_len: 128
  batch_size: 4
  max_steps: 500
  lr: 2.0e-5
  weight_decay: 0.01
  grad_clip: 1.0

geometry:
  layers: [4, 8, 11]
  every_n_steps: 5
  bank_positions: last
  top_k_neighbors: 8
  metrics:
    - interference_mean
    - spectral_participation
    - coactivation_overlap
  probe_prompts: null

logging:
  results_dir: results
  run_name: train_gpt2_small_geometry_paper_s0
  live_print: true
  save_every_n_steps: 100

control:
  enabled: false
  layer: 8
  metric: interference_mean
  mode: point
  target: 0.35
  weight: 1.0e-2
  every_n_steps: 5
  warmup_steps: 25
  abort_on_warmup_fail: true
  abort_on_warn: false

diff:
  top_k_neighbors: 8
  save_neighborhood_plot: true
  selected_features:
    - name: eiffel_located_in
      prompt: "The Eiffel Tower is located in"
      position: last
    - name: louvre_located_in
      prompt: "The Louvre Museum is located in"
      position: last
    - name: superposition_pack
      prompt: "Superposition allows neural networks to represent more features than"
      position: last
  cross_feature_pairs:
    - [eiffel_located_in, louvre_located_in]
    - [eiffel_located_in, superposition_pack]
    - [louvre_located_in, superposition_pack]
