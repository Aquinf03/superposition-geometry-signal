[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spg"
version = "0.1.0"
description = "Superposition Geometry — live geometry beside loss (track, diff, plot)"
readme = "sdk/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "spg contributors" }]
keywords = ["superposition", "geometry", "interpretability", "training", "metrics"]
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
full = [
  "transformer-lens>=2.0",
  "transformers>=4.40",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ashm/super"

[tool.setuptools.packages.find]
where = ["sdk"]
include = ["spg*"]
